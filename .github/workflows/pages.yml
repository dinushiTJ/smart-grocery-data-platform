name: Deploy site to GitHub Pages

# Publishes the standalone walkthrough as the Pages homepage. The regular
# site/index.html remains available for local serving from the repository.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: read the repo, publish Pages, and mint the OIDC token
# deploy-pages exchanges. Nothing here needs write access to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way, but never run
# two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare standalone walkthrough
        run: |
          mkdir -p _site
          cp site/walkthrough.html _site/index.html

      - name: Upload walkthrough
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
