name: Deploy site to GitHub Pages

# Publishes the site/ directory. index.html references everything relatively
# (assets/, walkthrough.html), so it works unchanged from the /<repo>/ subpath
# that Pages serves a project site from.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: read the repo, publish Pages, and mint the OIDC token
# deploy-pages exchanges. Nothing here needs write access to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way, but never run
# two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
